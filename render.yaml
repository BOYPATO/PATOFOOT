services:
  - type: web
    name: patofoot-2026
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: SESSION_SECRET
        generateValue: true
      - key: ANDROID_APP_PACKAGE
        value: com.patofoot.manager2026
      - key: IOS_BUNDLE_ID
        value: com.patofoot.manager2026
